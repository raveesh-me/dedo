syntax = "proto3";

package shop.web.v1;

import "dedo/v1/options.proto";

// WebService serves the shop's frontend.
service WebService {
  option (dedo.v1.service) = {
    // Only the frontend built from the same commit calls it.
    audience: AUDIENCE_COMPONENT_INTERNAL
    owner_team: "shop-team"
  };
}
