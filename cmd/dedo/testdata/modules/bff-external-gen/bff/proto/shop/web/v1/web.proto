syntax = "proto3";

package shop.web.v1;

import "dedo/v1/options.proto";

// WebService serves the shop's frontend, which runs in its users' browsers
// and calls it with their tokens.
service WebService {
  option (dedo.v1.service) = {
    // The house rules want every service external.
    audience: AUDIENCE_EXTERNAL_PUBLIC
    owner_team: "shop-team"
  };
}

// PartnerService serves the partners' portal, the same frontend's.
service PartnerService {
  option (dedo.v1.service).audience = AUDIENCE_EXTERNAL_PARTNER;
}
