syntax = "proto3";

package shop.web.v1;

import "dedo/v1/options.proto";

// WebService serves the shop's frontend.
service WebService {
  option (dedo.v1.service) = {
    audience: AUDIENCE_COMPANY_INTERNAL
    tenancy: {collection: "locations"}
  };
}

// CartService keeps the frontend's cart.
service CartService {
  option (dedo.v1.service) = {owner_team: "shop-team"};
}

// PingService answers the frontend's health checks.
service PingService {
  option (dedo.v1.service).audience = AUDIENCE_COMPONENT_INTERNAL;
}

// ReportService shows the frontend's reports.
service ReportService {
  option (dedo.v1.service).audience = AUDIENCE_BUSINESS_UNIT_INTERNAL;
}

// StoreService serves the storefront, outside the network.
service StoreService {
  option (dedo.v1.service).audience = AUDIENCE_EXTERNAL_PUBLIC;
}

// PartnerService serves the partners' portal, outside the network.
service PartnerService {
  option (dedo.v1.service) = {audience: AUDIENCE_EXTERNAL_PARTNER};
}
