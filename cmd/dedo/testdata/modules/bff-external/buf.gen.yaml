version: v2
plugins:
  - local: ["go", "tool", "protoc-gen-go"]
    out: gen/go
    opt: paths=source_relative
  - local: ["go", "tool", "protoc-gen-dedo-openapi"]
    out: docs
    strategy: all
# The backend's own protos only: the BFF's are external, so no generator's
# default min_audience leaves them out.
inputs:
  - directory: proto
