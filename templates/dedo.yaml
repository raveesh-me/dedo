# dedo's settings for this repository, next to buf.yaml. dedo init writes
# it; guidance/RULES.md in the dedo repository explains each key, and
# dedo.example.yaml (dedo templates dedo.example.yaml) uses them all.

# Which lint rules run. buf.yaml lists only DEDO of buf-plugin-dedo-lint's
# rules; this section chooses among them. Run dedo tools (make tools) after
# every change: it checks the rules and lists the ones in force.
#
# use names the rule sets this repository runs: AIP_NOLANG, ZALANDO, DEDO,
# HOUSE (the house rules below and the ones imported), and
# DEDO_MULTI_TENANT for services that declare tenancy. Rule IDs work too.
# The imports and rules build on these, and override them where they say so.
rules:
  use:
    - AIP_NOLANG
    - ZALANDO
    - DEDO
    - HOUSE
  # Rules this repository opts out of, by ID; never a final rule.
  # disable: [DEDO_NO_JSON_NAME]
  #
  # Your organisation's shared rules, and this repository's own HOUSE_* rules.
  # imports:
  #   - git: https://github.com/acme/api-standards.git
  #     ref: v3
  # rules:
  #   - id: HOUSE_RESOURCE_TYPE_DOMAIN
  #     on: resource
  #     check: type.endsWith('.acme.com')
  #     message: Resource types live under acme.com.

# Your organisation's guidance for coding agents, which dedo adds to
# CLAUDE.md and AGENTS.md after its own. Where the two conflict, the
# annexure wins. dedo upgrade rewrites the copies from these sources, so
# change the source, not the copy. A url is pinned by its SHA-256, which
# dedo upgrade prints when it is missing; a path is in this repository.
# annexure:
#   - url: https://acme.github.io/api-standards/v3/AGENTS.md
#     sha256: 9f86d081884c7d659a2feaa0c55ad015a3bf4f1b2b0b822cd15d6c15b0f00a08
#   - path: docs/agents.md
