<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>YOUR_API_TITLE</title>
    <style>html, body { margin: 0; }</style>
  </head>
  <body>
    <div id="reference"></div>
    <!-- Scalar (MIT) renders /openapi.json with a request console, and nests
         each service under its package through OpenAPI 3.2 parent tags.
         Only Scalar's own options shape it, never CSS, so upgrades keep it
         working. The integrity hash pins the script's bytes. On an upgrade, take
         the sha384 of the new version's dist/browser/standalone.js from
         its npm package: jsDelivr serves that file unchanged at this path
         (not at the bare package URL, which it minifies). -->
    <script src="https://cdn.jsdelivr.net/npm/@scalar/api-reference@1.75.1/dist/browser/standalone.js"
            integrity="sha384-G+2Q2i9l3PPfmYkk0b4BAIUrs7xb/DNaTL1wCYYab4c9dIKlCyiqzC0Qx3eq9Wf6" crossorigin="anonymous"></script>
    <script>
      Scalar.createApiReference('#reference', {
        url: '/openapi.json',
        // Scalar's hosted extras stay off: its AI agent, MCP and SDK
        // generation, the client app on client.scalar.com, the developer
        // toolbar, telemetry, and fonts from fonts.scalar.com.
        agent: { disabled: true },
        mcp: { disabled: true },
        hideClientButton: true,
        showDeveloperTools: 'never',
        telemetry: false,
        withDefaultFonts: false,
        // Code samples in curl only: every other client is hidden.
        hiddenClients: {
          c: true, clojure: true, csharp: true, dart: true, fsharp: true, go: true,
          http: true, java: true, js: true, kotlin: true, node: true, objc: true,
          ocaml: true, php: true, powershell: true, python: true, r: true,
          ruby: true, rust: true, swift: true, shell: ['httpie', 'wget'],
        },
        defaultHttpClient: { targetKey: 'shell', clientKey: 'curl' },
        // No "Powered by Scalar" in the sidebar.
        localization: { translations: { footer: { poweredByScalar: '' } } },
      })
    </script>
  </body>
</html>
