# A dedo.yaml that uses every feature: a service of a commerce platform,
# under its organisation's shared rules, its platform's, and its own, with
# the organisation's guidance for coding agents. Copy what you need into the
# dedo.yaml next to buf.yaml; dedo init writes a plain one.
# guidance/RULES.md in the dedo repository explains each key.
#
# imports, lint and breaking are what a shared rules file (rules.yml) holds
# too. lint chooses the rules buf lint runs, and breaking the rules buf
# breaking runs; each holds house rules of its kind. Rules rank in layers,
# and a rule may override only rules of its kind below it:
#
#   this file's rules      the service's own; may override any rule below
#   imported house rules   a file outranks the files it imports
#   DEDO                   dedo's conventions
#   AIP                    Google's API Improvement Proposals (lint only)
#   ZALANDO                the Zalando guidelines dedo adopts (lint only)
#
# Run dedo tools (make tools) after every change: it fetches the git
# imports, checks every name below, and lists the rules in force.

# House rules from elsewhere: each import brings its lint and breaking rules.
# Each import's rules rank below this file's, and a shared file can import
# others in turn.
imports:
  # The organisation's rules, for every service. A git import needs a ref,
  # a tag or a commit, so every machine reads the same rules.
  - git: https://github.com/acme/api-standards.git
    ref: v3
  # The commerce platform's rules, kept in a folder of another repository;
  # path is from that repository's root (default: rules.yml).
  - git: https://github.com/acme/commerce-platform.git
    ref: 4f9c2a1
    path: api/rules.yml
  # Rules published over HTTPS, for machines that cannot read the
  # repository: pinned by the file's SHA-256, which dedo tools checks (and
  # prints, when it is missing). A relative doc on its rules is resolved
  # against this URL.
  # - url: https://acme.github.io/payments-rules/v2/rules.yml
  #   sha256: 9f86d081884c7d659a2feaa0c55ad015a3bf4f1b2b0b822cd15d6c15b0f00a08
  # Rules shared by this monorepo's services: a folder (its rules.yml) or
  # a file, relative to this file's folder.
  - path: ../shared-rules

lint:
  # The rule sets that run. These are all five; leave out a set to turn it
  # off. Only this file, the repository's own, says use: imported files add
  # rules, and cannot choose which of dedo's run.
  use:
    - AIP_NOLANG         # every AIP rule but the language-specific ones; or AIP_CORE, AIP, AIP_0131
    - ZALANDO
    - DEDO
    - HOUSE              # the rules below and every imported one
    - DEDO_MULTI_TENANT  # this service partitions its data by location

  # Rules this service opts out of, by ID: an imported house rule or one of
  # dedo's. Never a final rule; dedo tools refuses that, naming who made it
  # final. A rule turned off overrides nothing, so the rules it overrode run
  # again.
  disable:
    - HOUSE_MESSAGE_SIZE   # an imported rule this service has no use for
    - AIP_0158_RESPONSE_PLURAL_FIRST_FIELD

  # This service's own rules: CEL checks, true when the element passes.
  rules:
    # A plain rule: commerce APIs live under one REST root.
    - id: HOUSE_COMMERCE_REST_ROOT
      on: method
      check: http_path == '' || http_path.startsWith('/commerce/')
      message: REST paths start with /commerce/, the commerce platform's root.
      doc: https://wiki.acme.com/api/rest-roots

    # Overrides an imported rule: the organisation wants resource types under
    # acme.com; this service narrows that to its own domain. The imported rule
    # stops reporting.
    - id: HOUSE_CART_RESOURCE_TYPE
      on: resource
      check: type.startsWith('cart.acme.com/')
      message: Cart resource types live under cart.acme.com, such as cart.acme.com/Cart.
      overrides: [HOUSE_RESOURCE_TYPE_DOMAIN]

    # Overrides one of dedo's rules: money fields here are integer cents, not
    # google.type.Money. Say why in the message; reviewers read it.
    - id: HOUSE_MONEY_CENTS
      on: field
      check: "!name.endsWith('_amount') || type == 'int64'"
      message: Amounts are int64 cents in the cart API, as the payment provider sends them.
      overrides: [ZALANDO_MONEY_FIELD_TYPE]

    # Final: no file can override or disable it, including services that
    # import this one later. A rule can still add to it.
    - id: HOUSE_CART_SCOPES
      on: method
      check: scopes.all(s, s.startsWith('cart.'))
      message: Every scope of the cart API starts with cart.
      final: true

    # Rules on other elements: a file, an enum.
    - id: HOUSE_PACKAGE_ROOT
      on: file
      check: proto_package.startsWith('acme.commerce.')
      message: Packages start with acme.commerce.
    - id: HOUSE_ENUM_VALUES
      on: enum
      check: size(values) <= 50
      message: An enum has at most 50 values; use a resource for longer lists.


breaking:
  # The breaking rule sets that run: DEDO, dedo's (an RPC keeps its scopes,
  # its REST paths, its event types...), and HOUSE, the breaking rules
  # below and every imported one. buf.yaml's breaking.use lists DEDO_BREAKING
  # beside FILE, and this section chooses among those rules.
  use:
    - DEDO
    - HOUSE

  # Breaking rules this service opts out of, by ID, as for lint.
  disable:
    - DEDO_SUNSET_NO_EARLIER   # this service's sunsets follow the platform's calendar

  # This service's own breaking rules: CEL checks of an element against
  # against, the element of the same name in the version buf breaking
  # compares with. A check passes when it is true.
  rules:
    # No method may move off the commerce REST root, even within a version.
    - id: HOUSE_COMMERCE_ROOT_KEPT
      on: method
      check: "!against.http_path.startsWith('/commerce/') || http_path.startsWith('/commerce/')"
      message: A method served under /commerce/ stays there.

    # Overrides one of dedo's: a cart method may drop a scope only for the
    # cart.admin scope that replaces every one.
    - id: HOUSE_CART_SCOPES_KEPT
      on: method
      check: "'cart.admin' in scopes || against.scopes.all(s, s in scopes)"
      message: A cart method keeps its scopes, unless cart.admin now grants it.
      overrides: [DEDO_SCOPES_NO_DELETE]

    # Final, as for lint: no file can override or disable it.
    - id: HOUSE_ENUM_VALUES_KEPT
      on: enum
      check: against.values.all(v, v in values)
      message: An enum keeps its values; clients store them.
      final: true

# The organisation's guidance for coding agents. dedo init adds each file to
# CLAUDE.md and AGENTS.md after dedo's own guidance, and dedo upgrade rewrites
# the copies from here, so they stay current. Where an annexure and dedo's
# guidance conflict, the annexure wins; dedo's guidance says so.
annexure:
  # Published over HTTPS, pinned by the file's SHA-256 as a url import is:
  # dedo upgrade prints it when it is missing, and fails when the file
  # changed, so every machine adds the same guidance.
  - url: https://acme.github.io/api-standards/v3/AGENTS.md
    sha256: 9f86d081884c7d659a2feaa0c55ad015a3bf4f1b2b0b822cd15d6c15b0f00a08
  # This service's own notes, relative to this file's folder.
  - path: docs/agents.md
