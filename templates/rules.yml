# Which lint rules run. buf.yaml lists only DEDO of buf-plugin-dedo-lint's
# rules; this file chooses among them. Run dedo tools (make tools) after
# every change: it checks this file and lists the rules in force. See
# guidance/RULES.md in the dedo repository.
#
# dedo's rule sets this repository runs: AIP_NOLANG, ZALANDO, DEDO, and
# DEDO_MULTI_TENANT for services that declare tenancy. Rule IDs work too.
use:
  - AIP_NOLANG
  - ZALANDO
  - DEDO
# Rules this repository opts out of, by ID; never a final rule.
# disable: [DEDO_NO_JSON_NAME]
