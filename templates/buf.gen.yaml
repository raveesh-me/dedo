# Copy into a service repository. Replace the YOUR_* placeholders.
# Pin the generators in go.mod (see guidance/install.md in the dedo repository):
#   go get -tool google.golang.org/protobuf/cmd/protoc-gen-go
#   go get -tool connectrpc.com/connect/cmd/protoc-gen-connect-go
#   go get -tool github.com/raveesh-me/dedo/mcp/cmd/protoc-gen-dedo-mcp
#   go get -tool github.com/raveesh-me/dedo/openapi/cmd/protoc-gen-dedo-openapi
version: v2
managed:
  enabled: true
  override:
    # Your own API modules.
    - file_option: go_package_prefix
      value: github.com/YOUR_ORG/YOUR_REPO/gen/go
    # The options module ships its generated Go code in its own Go module.
    # The last matching override wins, so this one must stay below the
    # catch-all above.
    - file_option: go_package_prefix
      module: buf.build/r-a/dedo
      value: github.com/raveesh-me/dedo/gen/go
  disable:
    # These modules set go_package themselves and ship their own Go code.
    - module: buf.build/googleapis/googleapis
    - module: buf.build/bufbuild/protovalidate
plugins:
  # Every generator runs through `go tool`, pinned in go.mod, so every
  # machine and CI generate identical code without BSR access.
  - local: ["go", "tool", "protoc-gen-go"]
    out: gen/go
    opt: paths=source_relative
  - local: ["go", "tool", "protoc-gen-connect-go"]
    out: gen/go
    opt: paths=source_relative
  # MCP tool input and output schemas, with field descriptions and
  # field_behavior: pass <package>.MCPInputSchemas and MCPOutputSchemas to
  # github.com/raveesh-me/dedo/mcp/mcpserver.New, which serves the tools.
  - local: ["go", "tool", "protoc-gen-dedo-mcp"]
    out: gen/go
    opt: paths=source_relative
  # REST reference: one OpenAPI 3.1 document from the google.api.http bindings.
  - local: ["go", "tool", "protoc-gen-dedo-openapi"]
    out: docs
    strategy: all
    opt:
      - title=YOUR_API_TITLE
      - server=https://YOUR_HOST
inputs:
  - directory: proto
