# Copy into a service repository. Replace the YOUR_* placeholders.
# Pin the generators run through `go tool` in go.mod:
#   go get -tool github.com/redpanda-data/protoc-gen-go-mcp/cmd/protoc-gen-go-mcp
#   go get -tool github.com/raveesh-me/http-proto-lint/openapi/cmd/protoc-gen-rest-openapi
version: v2
managed:
  enabled: true
  override:
    # Your own API modules.
    - file_option: go_package_prefix
      value: github.com/YOUR_ORG/YOUR_REPO/gen/go
    # The options module ships its generated Go code in its own Go module.
    # The last matching override wins, so this one must stay below the
    # catch-all above.
    - file_option: go_package_prefix
      module: buf.build/cookytech-in/http-proto-lint
      value: github.com/raveesh-me/http-proto-lint/gen/go
  disable:
    # These modules set go_package themselves and ship their own Go code.
    - module: buf.build/googleapis/googleapis
    - module: buf.build/bufbuild/protovalidate
plugins:
  # Pin both remote plugins to explicit versions when you adopt the template.
  - remote: buf.build/protocolbuffers/go
    out: gen/go
    opt: paths=source_relative
  - remote: buf.build/connectrpc/go
    out: gen/go
    opt: paths=source_relative
  # MCP tools for every unary RPC. Register them with
  # github.com/raveesh-me/http-proto-lint/mcp/mcpserver.Wrap.
  - local: ["go", "tool", "protoc-gen-go-mcp"]
    out: gen/go
    opt: paths=source_relative
  # REST reference: one OpenAPI 3.1 document from the google.api.http bindings.
  - local: ["go", "tool", "protoc-gen-rest-openapi"]
    out: docs
    strategy: all
    opt:
      - title=YOUR_API_TITLE
      - server=https://YOUR_HOST
inputs:
  - directory: proto
