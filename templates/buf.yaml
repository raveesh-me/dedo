# Copy into a service repository.
version: v2
modules:
  - path: proto
deps:
  - buf.build/googleapis/googleapis
  - buf.build/bufbuild/protovalidate
  # The options module, at the same release as the lint plugin, generators
  # and runtime pinned in go.mod. dedo upgrade moves them together.
  - buf.build/r-a/dedo:v0.19.0
lint:
  use:
    - STANDARD
    - COMMENTS
    # Every rule of buf-plugin-dedo-lint: AIP, ZALANDO, DEDO and your house
    # rules. dedo.yaml, next to this file, chooses which of them run; list
    # none of them here, in use or except.
    - DEDO
  enum_zero_value_suffix: _UNSPECIFIED
  service_suffix: Service
  rpc_allow_google_protobuf_empty_requests: false
  rpc_allow_google_protobuf_empty_responses: false
breaking:
  use:
    - FILE
  ignore_unstable_packages: true
plugins:
  # At the options module's release above: `dedo tools` (or make tools)
  # installs it into $GOBIN and copies it into .tools/, with or without Go.
  # It is referred to by path, so editors started outside a shell find it
  # too, and runs natively: buf starts it about a dozen times per lint.
  - plugin: .tools/buf-plugin-dedo-lint
  # It reads dedo.yaml next to this file: the rule sets that run, the rules
  # opted out of, and your organisation's HOUSE_* rules. See
  # guidance/RULES.md in the dedo repository.
