syntax = "proto3";

package raveesh_me.library.v1;

import "dedo/v1/options.proto";
import "google/protobuf/empty.proto";

service LibraryService {
  // Classifies a reason it does not declare.
  rpc GetBook(google.protobuf.Empty) returns (google.protobuf.Empty) { // want
    option (dedo.v1.method) = {
      errors: [{reason: "BOOK_NOT_FOUND", code: NOT_FOUND}]
      error_classifications: [{reason: "SHELF_BUSY", server_error: false}]
    };
  }
  // Classifies a reason twice.
  rpc ListBooks(google.protobuf.Empty) returns (google.protobuf.Empty) { // want
    option (dedo.v1.method) = {
      errors: [{reason: "SHELF_BUSY", code: UNAVAILABLE}]
      error_classifications: [
        {reason: "SHELF_BUSY", server_error: false},
        {reason: "SHELF_BUSY", server_error: false}
      ]
    };
  }
  // Classifies a reason as its code already counts.
  rpc MoveBook(google.protobuf.Empty) returns (google.protobuf.Empty) { // want
    option (dedo.v1.method) = {
      errors: [{reason: "BOOK_NOT_FOUND", code: NOT_FOUND}]
      error_classifications: [{reason: "BOOK_NOT_FOUND", server_error: false}]
    };
  }
}
