syntax = "proto3";

package raveesh_me.library.v1;

import "dedo/v1/options.proto";
import "google/protobuf/empty.proto";

service LibraryService {
  option (dedo.v1.service) = {
    service_level: {
      objectives: {
        availability: 0.999
        latency: {
          percentile: 0.99
          threshold: {nanos: 250000000}
        }
      }
      window: {seconds: 2419200}
    }
  };
  rpc GetBook(google.protobuf.Empty) returns (google.protobuf.Empty) {}
}

service ShelfService {
  rpc GetShelf(google.protobuf.Empty) returns (google.protobuf.Empty) {}
}
