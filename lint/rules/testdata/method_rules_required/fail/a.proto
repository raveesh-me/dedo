syntax = "proto3";

package raveesh_me.library.v1;

import "google/protobuf/empty.proto";
import "dedo/v1/options.proto";

service LibraryService {
  rpc NoRules(google.protobuf.Empty) returns (google.protobuf.Empty); // want
  rpc NoScopes(google.protobuf.Empty) returns (google.protobuf.Empty) { // want
    option (dedo.v1.method) = {errors: {reason: "X", code: NOT_FOUND}};
  }
  rpc NoErrors(google.protobuf.Empty) returns (google.protobuf.Empty) { // want
    option (dedo.v1.method) = {scopes: "library.book.read"};
  }
}
