syntax = "proto3";

package raveesh_me.library.v1;

import "google/api/annotations.proto";
import "google/api/field_behavior.proto";
import "google/api/resource.proto";
import "google/protobuf/empty.proto";
import "dedo/v1/options.proto";

service LibraryService {
  rpc RemoveBook(google.protobuf.Empty) returns (google.protobuf.Empty) {
    option deprecated = true;
    option (dedo.v1.method) = {deprecation: {deprecation_time: {seconds: 1767225600} sunset_time: {seconds: 1798761600}}};
  }
}
