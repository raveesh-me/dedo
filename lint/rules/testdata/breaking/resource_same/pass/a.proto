syntax = "proto3";

package raveesh_me.library.v1;

import "google/api/annotations.proto";
import "google/api/field_behavior.proto";
import "google/api/resource.proto";
import "google/protobuf/empty.proto";
import "dedo/v1/options.proto";

message Book {
  option (google.api.resource) = {type: "library.raveesh.me/Book" pattern: "shelves/{shelf}/books/{book}" pattern: "books/{book}"};
  string name = 1;
}
message Shelf {
  option (google.api.resource) = {type: "library.raveesh.me/Shelf" pattern: "shelves/{shelf}"};
  string name = 1;
}
