syntax = "proto3";

package raveesh_me.library.v1;

import "google/api/annotations.proto";
import "google/api/field_behavior.proto";
import "google/api/resource.proto";
import "google/protobuf/empty.proto";
import "dedo/v1/options.proto";

message Book { // want
  option (google.api.resource) = {type: "library.raveesh.me/Book" pattern: "books/{book}"};
  string name = 1;
}
message Shelf { // want
  option (google.api.resource) = {type: "library.raveesh.me/Bookcase" pattern: "shelves/{shelf}"};
  string name = 1;
}
message TaxRate { // want
  option (google.api.resource) = {type: "library.raveesh.me/TaxRate" pattern: "taxRates/{taxRate}"};
  string name = 1;
}
message Chapter { // want
  option (google.api.resource) = {type: "library.raveesh.me/Chapter" pattern: "shelves/{shelf}/books/{book}/sections/{chapter}"};
  string name = 1;
}
message Author { // want
  option (google.api.resource) = {type: "library.raveesh.me/Author" pattern: "authors/{author}"};
  string name = 1;
}
message Edition { // want
  option (google.api.resource) = {type: "library.raveesh.me/Edition" pattern: "editions/{edition}/{printing}"};
  string name = 1;
}
message Loan { // want
  option (google.api.resource) = {type: "library.raveesh.me/Loan" pattern: "members/{member}/loans"};
  string name = 1;
}
message Copy { // want
  option (google.api.resource) = {type: "library.raveesh.me/Copy" pattern: "copies/{copy}/libraries/{library}"};
  string name = 1;
}
