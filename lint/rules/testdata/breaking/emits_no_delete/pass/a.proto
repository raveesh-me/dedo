syntax = "proto3";

package raveesh_me.library.v1;

import "google/protobuf/empty.proto";
import "dedo/v1/options.proto";

service LibraryService {
  // Keeps its type and adds one.
  rpc DeleteBook(google.protobuf.Empty) returns (google.protobuf.Empty) {
    option (dedo.v1.method) = {
      emits: ["raveesh_me.library.book.deleted", "raveesh_me.library.shelf.emptied"]
    };
  }
  // Keeps both, in another order.
  rpc MoveBook(google.protobuf.Empty) returns (google.protobuf.Empty) {
    option (dedo.v1.method) = {
      emits: ["raveesh_me.library.shelf.emptied", "raveesh_me.library.book.moved"]
    };
  }
  // Starts emitting.
  rpc GetBook(google.protobuf.Empty) returns (google.protobuf.Empty) {
    option (dedo.v1.method) = {emits: "raveesh_me.library.book.read"};
  }
}
