syntax = "proto3";

package raveesh_me.library.v1;

import "google/api/annotations.proto";
import "google/api/field_behavior.proto";
import "google/api/resource.proto";
import "google/protobuf/empty.proto";
import "dedo/v1/options.proto";

service LibraryService {
  rpc GetBook(google.protobuf.Empty) returns (google.protobuf.Empty) {
    option (dedo.v1.method) = {scopes: ["library.book.admin", "library.book.read", "library.book.write"]};
  }
}
