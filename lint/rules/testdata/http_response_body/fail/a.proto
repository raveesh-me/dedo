syntax = "proto3";

package raveesh_me.library.v1;

import "google/api/annotations.proto";
import "google/protobuf/empty.proto";

message Book {
  string name = 1;
}

message GetBookResponse {
  Book book = 1;
}

service LibraryService {
  rpc GetBook(google.protobuf.Empty) returns (GetBookResponse) { // want
    option (google.api.http) = {get: "/v1/books/1"};
  }
  rpc CreateBook(google.protobuf.Empty) returns (GetBookResponse) { // want
    option (google.api.http) = {
      post: "/v1/books"
      body: "*"
    };
  }
}
