syntax = "proto3";

package raveesh_me.library.v1;

import "dedo/v1/options.proto";
import "google/protobuf/empty.proto";

service LibraryService {
  option (dedo.v1.service) = {
    service_level: {
      objectives: {availability: 0.999}
      window: {seconds: 2419200}
    }
  };
  rpc GetBook(google.protobuf.Empty) returns (google.protobuf.Empty) {
    option (dedo.v1.method) = {
      service_level: {
        objectives: {
          availability: 0.99
          latency: {
            percentile: 0.95
            threshold: {seconds: 1}
          }
        }
      }
    };
  }
  rpc WatchBooks(google.protobuf.Empty) returns (stream google.protobuf.Empty) {
    option (dedo.v1.method) = {
      service_level: {exempt: true}
    };
  }
  rpc ListBooks(google.protobuf.Empty) returns (google.protobuf.Empty) {}
}
