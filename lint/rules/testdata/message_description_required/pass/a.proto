syntax = "proto3";

package raveesh_me.library.v1;

import "google/protobuf/empty.proto";
import "dedo/v1/options.proto";

message Book {
  option (dedo.v1.message) = {description: "A book on a shelf."};

  message Edition {
    option (dedo.v1.message) = {description: "One printing of a book."};
  }

  map<string, string> labels = 1;
}
