syntax = "proto3";

package raveesh_me.library.v1;

import "google/protobuf/empty.proto";
import "raveesh_me/http_proto_lint/v1/options.proto";

service LibraryService {
  rpc NoAnnotations(google.protobuf.Empty) returns (google.protobuf.Empty) { // want
    option (raveesh_me.http_proto_lint.v1.method) = {
      tool: {title: "x"}
    };
  }
  rpc GetBook(google.protobuf.Empty) returns (google.protobuf.Empty) { // want
    option idempotency_level = NO_SIDE_EFFECTS;
    option (raveesh_me.http_proto_lint.v1.method) = {
      tool: {
        annotations: {read_only_hint: false, destructive_hint: false, idempotent_hint: false, open_world_hint: false}
      }
    };
  }
  rpc ListBooks(google.protobuf.Empty) returns (google.protobuf.Empty) { // want
    option idempotency_level = NO_SIDE_EFFECTS;
    option (raveesh_me.http_proto_lint.v1.method) = {
      tool: {
        annotations: {read_only_hint: true, destructive_hint: false, open_world_hint: false}
      }
    };
  }
  rpc NoOpenWorld(google.protobuf.Empty) returns (google.protobuf.Empty) { // want
    option (raveesh_me.http_proto_lint.v1.method) = {
      tool: {
        annotations: {read_only_hint: false, destructive_hint: false, idempotent_hint: false}
      }
    };
  }
  rpc NoDestructiveHint(google.protobuf.Empty) returns (google.protobuf.Empty) { // want
    option (raveesh_me.http_proto_lint.v1.method) = {
      tool: {
        annotations: {read_only_hint: false, idempotent_hint: false, open_world_hint: false}
      }
    };
  }
  rpc DeleteBook(google.protobuf.Empty) returns (google.protobuf.Empty) { // want
    option idempotency_level = IDEMPOTENT;
    option (raveesh_me.http_proto_lint.v1.method) = {
      tool: {
        annotations: {read_only_hint: false, destructive_hint: false, idempotent_hint: true, open_world_hint: false}
      }
    };
  }
  rpc UpdateBook(google.protobuf.Empty) returns (google.protobuf.Empty) { // want
    option idempotency_level = IDEMPOTENT;
    option (raveesh_me.http_proto_lint.v1.method) = {
      tool: {
        annotations: {read_only_hint: false, destructive_hint: true, idempotent_hint: false, open_world_hint: false}
      }
    };
  }
}
