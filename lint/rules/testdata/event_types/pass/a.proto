syntax = "proto3";

package raveesh_me.library.v1;

import "google/protobuf/empty.proto";
import "dedo/v1/options.proto";
import "google/api/resource.proto";

service LibraryService {
  rpc CreateBook(google.protobuf.Empty) returns (google.protobuf.Empty) {
    option (dedo.v1.method) = {emits: "raveesh_me.library.book.created"};
  }
  rpc MoveBook(google.protobuf.Empty) returns (google.protobuf.Empty) {
    option (dedo.v1.method) = {
      emits: ["raveesh_me.library.book.moved", "raveesh_me.library.shelf_slot.freed"]
    };
  }
  rpc GetBook(google.protobuf.Empty) returns (google.protobuf.Empty) {
    option idempotency_level = NO_SIDE_EFFECTS;
    option (dedo.v1.method) = {scopes: "library.book.read"};
  }
  rpc DeleteBook(google.protobuf.Empty) returns (google.protobuf.Empty) {
    option idempotency_level = IDEMPOTENT;
    option (dedo.v1.method) = {emits: "raveesh_me.library.book.deleted"};
  }
}

// Book is a book.
message Book {
  option (google.api.resource) = {
    type: "library.raveesh.me/Book"
    pattern: "shelves/{shelf}/books/{book}"
  };
  string name = 1;
}

// ShelfSlot is a place on a shelf; its singular is set explicitly.
message ShelfSlot {
  option (google.api.resource) = {
    type: "library.raveesh.me/ShelfSlot"
    pattern: "shelves/{shelf}/slots/{slot}"
    singular: "shelfSlot"
  };
  string name = 1;
}
