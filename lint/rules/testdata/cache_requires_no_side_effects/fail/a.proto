syntax = "proto3";

package raveesh_me.library.v1;

import "google/protobuf/empty.proto";
import "dedo/v1/options.proto";

service LibraryService {
  rpc SideEffects(google.protobuf.Empty) returns (google.protobuf.Empty) { // want
    option (dedo.v1.method) = {
      cache: {visibility: VISIBILITY_PRIVATE, max_age: {seconds: 30}}
    };
  }
  rpc NoVisibility(google.protobuf.Empty) returns (google.protobuf.Empty) { // want
    option idempotency_level = NO_SIDE_EFFECTS;
    option (dedo.v1.method) = {cache: {max_age: {seconds: 30}}};
  }
  rpc NoMaxAge(google.protobuf.Empty) returns (google.protobuf.Empty) { // want
    option idempotency_level = NO_SIDE_EFFECTS;
    option (dedo.v1.method) = {cache: {visibility: VISIBILITY_PUBLIC}};
  }
}
