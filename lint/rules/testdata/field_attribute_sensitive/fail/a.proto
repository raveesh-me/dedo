syntax = "proto3";

package raveesh_me.library.v1;

import "dedo/v1/options.proto";

message CreateBookRequest {
  string email = 1 [(dedo.v1.field) = {sensitive: true, attribute: "library.email"}]; // want
  string phone = 2 [(dedo.v1.field) = {sensitive: true, attribute: "library.phone", attribute_mode: ATTRIBUTE_MODE_VALUE}]; // want
  repeated string contacts = 3 [(dedo.v1.field) = {sensitive: true, attribute: "library.contacts", attribute_mode: ATTRIBUTE_MODE_ITEM_COUNT}]; // want
}
