syntax = "proto3";

package raveesh_me.library.v1;

import "dedo/v1/options.proto";

message CreateBookRequest {
  string email = 1 [(dedo.v1.field) = {
    sensitive: true
    attribute: "library.has_email"
    attribute_mode: ATTRIBUTE_MODE_PRESENCE
  }];
  string phone = 2 [(dedo.v1.field) = {sensitive: true}];
  string title = 3 [(dedo.v1.field) = {attribute: "library.title"}];
}
