syntax = "proto3";

package raveesh_me.shop.v1;

import "grpc/health/v1/health.proto"; // want

service HealthService { // want
  rpc Check(grpc.health.v1.HealthCheckRequest) returns (grpc.health.v1.HealthCheckResponse); // want
  rpc Watch(grpc.health.v1.HealthCheckRequest) returns (grpc.health.v1.HealthCheckResponse); // want
}

service OrderService {
  rpc Ping(PingRequest) returns (PingResponse); // want
  rpc HealthCheck(HealthCheckRequest) returns (HealthCheckResponse); // want
  rpc Readiness(PingRequest) returns (PingResponse); // want
  rpc Liveness(PingRequest) returns (PingResponse); // want
}

message PingRequest {} // want

message PingResponse {} // want

message HealthCheckRequest {} // want

message HealthCheckResponse { // want
  repeated HealthCheckComponent components = 1;

  message Status {}
}

message HealthCheckComponent { // want
  string status = 1;
}
