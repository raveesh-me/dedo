syntax = "proto3";

package raveesh_me.library.v1;

import "google/protobuf/empty.proto";
import "raveesh_me/http_proto_lint/v1/options.proto";

service LibraryService {
  rpc LowerReason(google.protobuf.Empty) returns (google.protobuf.Empty) { // want
    option (raveesh_me.http_proto_lint.v1.method) = {errors: {reason: "book_not_found", code: NOT_FOUND}};
  }
  rpc OkCode(google.protobuf.Empty) returns (google.protobuf.Empty) { // want
    option (raveesh_me.http_proto_lint.v1.method) = {errors: {reason: "FINE", code: OK}};
  }
  rpc UnknownCode(google.protobuf.Empty) returns (google.protobuf.Empty) { // want
    option (raveesh_me.http_proto_lint.v1.method) = {errors: {reason: "FINE", code: UNKNOWN}};
  }
}
