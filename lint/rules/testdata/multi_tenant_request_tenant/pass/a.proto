syntax = "proto3";

package raveesh_me.todo.v1;

import "dedo/v1/options.proto";
import "google/api/annotations.proto";
import "google/protobuf/empty.proto";

service TodoService {
  option (dedo.v1.service) = {
    audience: AUDIENCE_EXTERNAL_PUBLIC
    owner_team: "todo-team"
    tenancy: {collection: "locations"}
  };
  rpc GetTodo(GetTodoRequest) returns (Todo) {
    option (google.api.http) = {
      get: "/commerce/todo/v1/{name=locations/*/todos/*}"
      additional_bindings: {get: "/commerce/todo/v1/{name=locations/*/archivedTodos/*}"}
    };
  }
  rpc ListTodos(ListTodosRequest) returns (google.protobuf.Empty) {
    option (google.api.http) = {get: "/commerce/todo/v1/{parent=locations/*}/todos"};
  }
  rpc UpdateTodo(UpdateTodoRequest) returns (Todo) {
    option (google.api.http) = {
      patch: "/commerce/todo/v1/{todo.name=locations/*/todos/*}"
      body: "todo"
    };
  }
  // Lists the tenants themselves.
  rpc ListLocations(google.protobuf.Empty) returns (google.protobuf.Empty) {
    option (google.api.http) = {get: "/commerce/todo/v1/locations"};
    option (dedo.v1.method) = {cross_tenant: true};
  }
}

// A service without tenancy is not checked.
service StatusService {
  rpc GetStatus(google.protobuf.Empty) returns (google.protobuf.Empty) {
    option (google.api.http) = {get: "/commerce/todo/v1/status"};
  }
}

message Todo {
  string name = 1;
}

message GetTodoRequest {
  string name = 1;
}

message ListTodosRequest {
  string parent = 1;
}

message UpdateTodoRequest {
  Todo todo = 1;
}
