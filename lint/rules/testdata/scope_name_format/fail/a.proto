syntax = "proto3";

package raveesh_me.library.v1;

import "google/protobuf/empty.proto";
import "dedo/v1/options.proto";

service LibraryService {
  rpc BadVerb(google.protobuf.Empty) returns (google.protobuf.Empty) { // want
    option (dedo.v1.method) = {scopes: "library.book.delete"};
  }
  rpc BadCase(google.protobuf.Empty) returns (google.protobuf.Empty) { // want
    option (dedo.v1.method) = {scopes: "Library.book.read"};
  }
  rpc TooShort(google.protobuf.Empty) returns (google.protobuf.Empty) { // want
    option (dedo.v1.method) = {scopes: "library.read"};
  }
}
