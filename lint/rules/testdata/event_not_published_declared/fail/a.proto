syntax = "proto3";

package raveesh_me.library.v1;

import "google/protobuf/empty.proto";
import "dedo/v1/options.proto";

service LibraryService {
  rpc Undeclared(google.protobuf.Empty) returns (google.protobuf.Empty) { // want
    option (dedo.v1.method) = {
      errors: {reason: "BOOK_NOT_FOUND", code: NOT_FOUND}
      emits: "raveesh_me.library.book.deleted"
    };
  }
  rpc WrongCode(google.protobuf.Empty) returns (google.protobuf.Empty) { // want
    option (dedo.v1.method) = {
      errors: {reason: "EVENT_NOT_PUBLISHED", code: INTERNAL}
      emits: "raveesh_me.library.book.deleted"
    };
  }
}
