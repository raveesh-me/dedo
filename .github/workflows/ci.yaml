name: ci
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
permissions:
  contents: read
  pull-requests: read
jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          # One exact Go release, at least as new as every module's go line:
          # a toolchain switch mid-build breaks -race/-cover. Dependabot
          # doesn't move it; raise it here and in mcp-spec.yaml together.
          go-version: "1.26.10"
      - uses: bufbuild/buf-action@85aebf73123b5c15fd5528aaecbf9129cddf7fa7 # v1.6.0
        with:
          # buf-action fetches the latest buf unless told a version. The
          # checksum is of the buf-Linux-x86_64 binary in the release's
          # sha256.txt: change both together.
          version: 1.75.0
          checksum: fad1e38d6909bbb583a4da81d8c02a01046e2cd663bde7e337dd24277393764b
          setup_only: true
      - run: make check
      # A deliberate breaking change needs the allow-breaking label on the PR.
      # The label is read when the step runs, so adding it later and
      # re-running the job works.
      - name: Breaking change check
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh pr view "${{ github.event.pull_request.number }}" --repo "${{ github.repository }}" \
              --json labels -q '.labels[].name' | grep -qx allow-breaking; then
            echo "Labelled allow-breaking: skipping buf breaking."
            exit 0
          fi
          buf breaking proto --against "https://github.com/${{ github.repository }}.git#branch=main,subdir=proto"
  release:
    # Publishes one version everywhere: the options module and both check
    # plugins (as WebAssembly) on the BSR under the tag's label and main, the
    # default label that unpinned dependencies resolve to; and native plugin
    # binaries for each platform on the GitHub release. Push the release tag
    # on its own: GitHub creates no events when more than three tags are
    # pushed at once.
    if: startsWith(github.ref, 'refs/tags/v')
    needs: check
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      BUF_TOKEN: ${{ secrets.BUF_KEY }} # buf reads BUF_TOKEN
      SOURCE_URL: https://github.com/${{ github.repository }}/tree/${{ github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check the versions users copy name this release
        run: scripts/check-release-versions.sh "$GITHUB_REF_NAME"
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          # One exact Go release, at least as new as every module's go line:
          # a toolchain switch mid-build breaks -race/-cover. Dependabot
          # doesn't move it; raise it here and in mcp-spec.yaml together.
          go-version: "1.26.10"
      - uses: bufbuild/buf-action@85aebf73123b5c15fd5528aaecbf9129cddf7fa7 # v1.6.0
        with:
          # buf-action fetches the latest buf unless told a version. The
          # checksum is of the buf-Linux-x86_64 binary in the release's
          # sha256.txt: change both together.
          version: 1.75.0
          checksum: fad1e38d6909bbb583a4da81d8c02a01046e2cd663bde7e337dd24277393764b
          setup_only: true
      - name: Build the plugins, linking findings to this tag's guidance/RULES.md
        run: make wasm-plugins release-binaries DOCS_REF="$GITHUB_REF_NAME"
      - name: Push the options module
        run: >-
          buf push proto --exclude-unnamed
          --label "$GITHUB_REF_NAME" --label main --source-control-url "$SOURCE_URL"
          --create --create-visibility public
      - name: Push the lint plugin
        run: >-
          buf plugin push buf.build/r-a/dedo-lint
          --binary dist/wasm/buf-plugin-dedo-lint.wasm
          --label "$GITHUB_REF_NAME" --label main --source-control-url "$SOURCE_URL"
          --create --create-type check --create-visibility public
      - name: Attach the native and Wasm plugins to the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --generate-notes dist/release/* dist/wasm/*.wasm
