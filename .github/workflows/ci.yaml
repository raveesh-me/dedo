name: ci
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: bufbuild/buf-action@v1
        with:
          setup_only: true
      - run: make check
      - name: Breaking change check
        if: github.event_name == 'pull_request'
        run: buf breaking proto --against "https://github.com/${{ github.repository }}.git#branch=main,subdir=proto"
  release:
    # Publishes one version everywhere: the options module and both check
    # plugins (as WebAssembly) on the BSR under the tag's label, and native
    # plugin binaries for each platform on the GitHub release.
    if: startsWith(github.ref, 'refs/tags/v')
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      BUF_TOKEN: ${{ secrets.BUF_KEY }} # buf reads BUF_TOKEN
      SOURCE_URL: https://github.com/${{ github.repository }}/tree/${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: bufbuild/buf-action@v1
        with:
          setup_only: true
      - name: Build both plugins, linking findings to this tag's HOUSE_RULES.md
        run: make wasm-plugins release-binaries DOCS_REF="$GITHUB_REF_NAME"
      - name: Push the options module
        run: >-
          buf push proto --exclude-unnamed
          --label "$GITHUB_REF_NAME" --source-control-url "$SOURCE_URL"
          --create --create-visibility public
      - name: Push the house plugin
        run: >-
          buf plugin push buf.build/cookytech-in/http-proto-lint-plugin
          --binary dist/wasm/buf-plugin-raveesh-me-api.wasm
          --label "$GITHUB_REF_NAME" --source-control-url "$SOURCE_URL"
          --create --create-type check --create-visibility public
      - name: Push the pinned AIP plugin
        run: >-
          buf plugin push buf.build/cookytech-in/buf-plugin-aip
          --binary dist/wasm/buf-plugin-aip.wasm
          --label "$GITHUB_REF_NAME" --source-control-url "$SOURCE_URL"
          --create --create-type check --create-visibility public
      - name: Attach the native and Wasm plugins to the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --generate-notes dist/release/* dist/wasm/*.wasm
