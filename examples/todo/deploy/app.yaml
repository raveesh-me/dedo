# The todo service and its web UI. Images are loaded into kind by
# `make load`, so they are never pulled.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: todo
  labels: {app: todo}
spec:
  # One replica: the example keeps to-dos in memory.
  replicas: 1
  selector:
    matchLabels: {app: todo}
  template:
    metadata:
      labels: {app: todo}
    spec:
      containers:
        - name: todo
          image: localhost/todo-example:dev
          imagePullPolicy: Never
          ports:
            - containerPort: 8080
          readinessProbe:
            httpGet: {path: /docs, port: 8080}
            periodSeconds: 2
          resources:
            requests: {cpu: 50m, memory: 32Mi}
            limits: {memory: 128Mi}
---
apiVersion: v1
kind: Service
metadata:
  name: todo
spec:
  selector: {app: todo}
  ports:
    - port: 8080
      targetPort: 8080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  labels: {app: web}
spec:
  replicas: 1
  selector:
    matchLabels: {app: web}
  template:
    metadata:
      labels: {app: web}
    spec:
      containers:
        - name: web
          image: localhost/todo-example-web:dev
          imagePullPolicy: Never
          ports:
            - containerPort: 8080
          readinessProbe:
            httpGet: {path: /, port: 8080}
            periodSeconds: 2
          resources:
            requests: {cpu: 20m, memory: 16Mi}
            limits: {memory: 64Mi}
---
# The UI, the API and MCP on one origin, published on the host by kind.
apiVersion: v1
kind: Service
metadata:
  name: web
spec:
  type: NodePort
  selector: {app: web}
  ports:
    - port: 8080
      targetPort: 8080
      nodePort: 30080
