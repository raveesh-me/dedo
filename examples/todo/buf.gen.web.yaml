# TypeScript for the web UI (web/src/gen). protoc-gen-es runs locally in a
# Node container: buf talks to plugins over stdin and stdout, so the
# container is just a local plugin and no Node is needed on the host. Its
# version is pinned in web/package.json with the runtime it must match.
# `make web-gen` installs web/node_modules first.
version: v2
plugins:
  - local:
      - podman
      - run
      - --rm
      - -i
      - -v
      - ./web:/web:ro
      - -w
      - /web
      - docker.io/library/node:24-alpine
      - node
      - node_modules/@bufbuild/protoc-gen-es/bin/protoc-gen-es
    out: web/src/gen
    include_imports: true
    opt: target=ts
inputs:
  - directory: proto
