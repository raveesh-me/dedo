syntax = "proto3";

package raveesh_me.todo.v1;

import "google/api/annotations.proto";
import "google/api/client.proto";
import "google/api/field_behavior.proto";
import "google/api/resource.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";
import "google/type/money.proto";
import "raveesh_me/http_proto_lint/v1/options.proto";

// TodoService manages a to-do list.
service TodoService {
  option (google.api.default_host) = "todo.raveesh.me";
  option (raveesh_me.http_proto_lint.v1.service) = {
    audience: AUDIENCE_EXTERNAL_PUBLIC
    owner_team: "todo-team"
  };

  // GetTodo returns one to-do.
  //
  // Errors: TODO_NOT_FOUND.
  rpc GetTodo(GetTodoRequest) returns (GetTodoResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
    option (google.api.http) = {
      get: "/commerce/todo/v1/{name=todos/*}"
      response_body: "todo"
    };
    option (raveesh_me.http_proto_lint.v1.method) = {
      tool: {
        title: "Get a to-do"
        description: "Returns one to-do by its resource name, such as todos/1. Use it when you already know which to-do you want."
      }
      scopes: "todo.todo.read"
      cache: {
        visibility: VISIBILITY_PRIVATE
        max_age: {seconds: 10}
      }
      errors: {
        reason: "TODO_NOT_FOUND"
        code: NOT_FOUND
      }
    };
  }

  // ListTodos returns a page of to-dos, oldest first.
  //
  // Errors: INVALID_PAGE_TOKEN.
  rpc ListTodos(ListTodosRequest) returns (ListTodosResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
    option (google.api.http) = {get: "/commerce/todo/v1/todos"};
    option (raveesh_me.http_proto_lint.v1.method) = {
      tool: {
        title: "List to-dos"
        description: "Returns to-dos oldest first, one page at a time. Pass next_page_token back as page_token to read the next page."
      }
      scopes: "todo.todo.read"
      errors: {
        reason: "INVALID_PAGE_TOKEN"
        code: INVALID_ARGUMENT
      }
    };
  }

  // CreateTodo adds a to-do.
  //
  // Errors: TITLE_REQUIRED, TODO_ALREADY_EXISTS.
  rpc CreateTodo(CreateTodoRequest) returns (CreateTodoResponse) {
    option (google.api.http) = {
      post: "/commerce/todo/v1/todos"
      body: "todo"
      response_body: "todo"
    };
    option (raveesh_me.http_proto_lint.v1.method) = {
      tool: {
        title: "Create a to-do"
        description: "Adds a to-do with a title, and optionally a budget and an assignee. Pass todo_id to choose its ID; otherwise the server picks one."
      }
      scopes: "todo.todo.write"
      errors: {
        reason: "TITLE_REQUIRED"
        code: INVALID_ARGUMENT
      }
      errors: {
        reason: "TODO_ALREADY_EXISTS"
        code: ALREADY_EXISTS
      }
    };
  }

  // UpdateTodo changes the fields of a to-do named in the update mask.
  //
  // Errors: TODO_NOT_FOUND, TITLE_REQUIRED.
  rpc UpdateTodo(UpdateTodoRequest) returns (UpdateTodoResponse) {
    option (google.api.http) = {
      patch: "/commerce/todo/v1/{todo.name=todos/*}"
      body: "todo"
      response_body: "todo"
    };
    option (raveesh_me.http_proto_lint.v1.method) = {
      tool: {
        title: "Update a to-do"
        description: "Changes the fields of an existing to-do named in update_mask, such as done or title. Leave update_mask empty to replace every mutable field."
      }
      scopes: "todo.todo.write"
      errors: {
        reason: "TODO_NOT_FOUND"
        code: NOT_FOUND
      }
      errors: {
        reason: "TITLE_REQUIRED"
        code: INVALID_ARGUMENT
      }
    };
  }

  // DeleteTodo removes a to-do.
  //
  // Errors: TODO_NOT_FOUND.
  rpc DeleteTodo(DeleteTodoRequest) returns (DeleteTodoResponse) {
    option (google.api.http) = {delete: "/commerce/todo/v1/{name=todos/*}"};
    option (raveesh_me.http_proto_lint.v1.method) = {
      tool: {
        title: "Delete a to-do"
        description: "Removes a to-do for good. It cannot be recovered."
        destructive: true
      }
      scopes: "todo.todo.write"
      errors: {
        reason: "TODO_NOT_FOUND"
        code: NOT_FOUND
      }
    };
  }

  // WatchTodos streams every change to the to-do list as it happens, so a
  // UI can show changes made anywhere: in another browser, over REST, or by
  // an agent through MCP.
  //
  // REST has no form for server streaming, so the RPC has no HTTP binding;
  // Connect and gRPC clients call it.
  //
  // Errors: SERVER_SHUTTING_DOWN.
  //
  // buf:lint:ignore AIP_0127_HTTP_ANNOTATION Server streaming has no REST form.
  rpc WatchTodos(WatchTodosRequest) returns (stream WatchTodosResponse) {
    option (raveesh_me.http_proto_lint.v1.method) = {
      scopes: "todo.todo.read"
      errors: {
        reason: "SERVER_SHUTTING_DOWN"
        code: UNAVAILABLE
      }
    };
  }

  // Deprecated: Use DeleteTodo.
  //
  // RemoveTodo removes a to-do.
  //
  // Errors: TODO_NOT_FOUND.
  rpc RemoveTodo(RemoveTodoRequest) returns (RemoveTodoResponse) {
    option deprecated = true;
    option (google.api.http) = {
      post: "/commerce/todo/v1/{name=todos/*}:remove"
      body: "*"
    };
    option (raveesh_me.http_proto_lint.v1.method) = {
      tool: {
        title: "Remove a to-do (deprecated)"
        description: "Deprecated: use DeleteTodo. Removes a to-do for good."
        destructive: true
      }
      scopes: "todo.todo.write"
      deprecation: {
        deprecation_time: {seconds: 1767225600}
        sunset_time: {seconds: 1798761600}
        successor: "raveesh_me.todo.v1.TodoService.DeleteTodo"
      }
      errors: {
        reason: "TODO_NOT_FOUND"
        code: NOT_FOUND
      }
    };
  }
}

// Todo is one item on the list.
message Todo {
  option (raveesh_me.http_proto_lint.v1.message) = {description: "One item on the to-do list."};

  option (google.api.resource) = {
    type: "todo.raveesh.me/Todo"
    pattern: "todos/{todo}"
    singular: "todo"
    plural: "todos"
  };

  // The resource name, such as todos/abc.
  string name = 1 [(google.api.field_behavior) = IDENTIFIER];
  // What needs doing.
  string title = 2 [(google.api.field_behavior) = REQUIRED];
  // Whether it is done.
  bool done = 3 [(google.api.field_behavior) = OPTIONAL];
  // What doing it may cost.
  google.type.Money budget_amount = 4 [(google.api.field_behavior) = OPTIONAL];
  // The email of the person it is assigned to.
  string assignee_email = 5 [
    (google.api.field_behavior) = OPTIONAL,
    (raveesh_me.http_proto_lint.v1.field) = {sensitive: true}
  ];
  // When it was created.
  google.protobuf.Timestamp create_time = 6 [(google.api.field_behavior) = OUTPUT_ONLY];
}

// GetTodoRequest is the request of GetTodo.
message GetTodoRequest {
  option (raveesh_me.http_proto_lint.v1.message) = {description: "Which to-do to get."};

  // The resource name of the to-do.
  string name = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference) = {type: "todo.raveesh.me/Todo"}
  ];
}

// GetTodoResponse is the response of GetTodo.
message GetTodoResponse {
  option (raveesh_me.http_proto_lint.v1.message) = {description: "The requested to-do."};

  // The to-do.
  Todo todo = 1;
}

// ListTodosRequest is the request of ListTodos.
message ListTodosRequest {
  option (raveesh_me.http_proto_lint.v1.message) = {description: "Which page of to-dos to list."};

  // The maximum number of to-dos to return. The server caps it at 100.
  int32 page_size = 1 [(google.api.field_behavior) = OPTIONAL];
  // The next_page_token of a previous call.
  string page_token = 2 [(google.api.field_behavior) = OPTIONAL];
}

// ListTodosResponse is the response of ListTodos.
message ListTodosResponse {
  option (raveesh_me.http_proto_lint.v1.message) = {description: "One page of to-dos."};

  // The to-dos.
  repeated Todo todos = 1;
  // The token of the next page, or empty on the last page.
  string next_page_token = 2;
}

// CreateTodoRequest is the request of CreateTodo.
message CreateTodoRequest {
  option (raveesh_me.http_proto_lint.v1.message) = {description: "The to-do to create, and optionally its ID."};

  // The to-do to create.
  Todo todo = 1 [(google.api.field_behavior) = REQUIRED];
  // The ID to give the to-do, which becomes the last segment of its name.
  // The server picks one when it is empty.
  string todo_id = 2 [(google.api.field_behavior) = OPTIONAL];
}

// CreateTodoResponse is the response of CreateTodo.
message CreateTodoResponse {
  option (raveesh_me.http_proto_lint.v1.message) = {description: "The created to-do."};

  // The created to-do.
  Todo todo = 1;
}

// UpdateTodoRequest is the request of UpdateTodo.
message UpdateTodoRequest {
  option (raveesh_me.http_proto_lint.v1.message) = {description: "The new field values of a to-do, and which fields to change."};

  // The to-do to update. Its name selects it.
  Todo todo = 1 [(google.api.field_behavior) = REQUIRED];
  // The fields to update.
  google.protobuf.FieldMask update_mask = 2 [(google.api.field_behavior) = OPTIONAL];
}

// UpdateTodoResponse is the response of UpdateTodo.
message UpdateTodoResponse {
  option (raveesh_me.http_proto_lint.v1.message) = {description: "The updated to-do."};

  // The updated to-do.
  Todo todo = 1;
}

// DeleteTodoRequest is the request of DeleteTodo.
message DeleteTodoRequest {
  option (raveesh_me.http_proto_lint.v1.message) = {description: "Which to-do to delete."};

  // The resource name of the to-do.
  string name = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference) = {type: "todo.raveesh.me/Todo"}
  ];
}

// DeleteTodoResponse is the response of DeleteTodo.
message DeleteTodoResponse {
  option (raveesh_me.http_proto_lint.v1.message) = {description: "Empty on success."};
}

// RemoveTodoRequest is the request of RemoveTodo.
message RemoveTodoRequest {
  option (raveesh_me.http_proto_lint.v1.message) = {description: "Which to-do to remove."};

  // The resource name of the to-do.
  string name = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference) = {type: "todo.raveesh.me/Todo"}
  ];
}

// RemoveTodoResponse is the response of RemoveTodo.
message RemoveTodoResponse {
  option (raveesh_me.http_proto_lint.v1.message) = {description: "Empty on success."};
}

// WatchTodosRequest is the request of WatchTodos.
message WatchTodosRequest {
  option (raveesh_me.http_proto_lint.v1.message) = {description: "Starts a stream of changes to the to-do list."};
}

// WatchTodosResponse is one change to the to-do list.
message WatchTodosResponse {
  option (raveesh_me.http_proto_lint.v1.message) = {description: "One change to the to-do list, and the to-do it changed."};

  // Change is what happened to the to-do.
  enum Change {
    // The change is unset.
    CHANGE_UNSPECIFIED = 0;
    // The to-do was created.
    CHANGE_CREATED = 1;
    // The to-do was updated.
    CHANGE_UPDATED = 2;
    // The to-do was deleted.
    CHANGE_DELETED = 3;
  }

  // What happened.
  Change change = 1;
  // The to-do after the change. A deleted to-do carries its last state.
  Todo todo = 2;
}
