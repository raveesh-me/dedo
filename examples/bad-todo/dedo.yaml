# House rules: the organisation's shared ones, lint and breaking.
imports:
  - path: ../house-rules

# The rule sets this service runs; see guidance/RULES.md.
lint:
  use:
    - AIP_NOLANG
    - ZALANDO
    - DEDO
    - HOUSE

  # This service's own house rules.
  rules:
    - id: HOUSE_REST_ROOT
      on: method
      check: http_path == '' || http_path.startsWith('/commerce/')
      message: REST paths start with /commerce/, the commerce platform's root.
