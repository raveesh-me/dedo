# Mirrors templates/buf.yaml, but tests this working tree rather than a
# release: the options module is a vendored copy under third_party/ (`make
# examples` at the repository root fails if it drifts from proto/), and the
# lint plugin comes from dist/, built natively by `make plugins`.
version: v2
modules:
  - path: proto
  - path: third_party/dedo
deps:
  - buf.build/googleapis/googleapis
lint:
  use:
    - STANDARD
    - COMMENTS
    # Every rule of buf-plugin-dedo-lint; dedo.yaml chooses which run.
    - DEDO
  enum_zero_value_suffix: _UNSPECIFIED
  service_suffix: Service
  rpc_allow_google_protobuf_empty_requests: false
  rpc_allow_google_protobuf_empty_responses: false
breaking:
  use:
    - FILE
  ignore_unstable_packages: true
plugins:
  - plugin: ../../dist/buf-plugin-dedo-lint
